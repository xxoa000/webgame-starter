services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: webgame
      MYSQL_USER: webgame
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -uroot -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://webgame:${MYSQL_PASSWORD}@mysql:3306/webgame?charset=utf8mb4
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5174}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ACCESS_HOURS: ${JWT_ACCESS_HOURS:-24}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5174}:5174"
    depends_on:
      - backend
volumes:
  mysql_data:
